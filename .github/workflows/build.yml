name: "Build kernels for release"

env:
  OUT_DIR: "${{ github.workspace }}/out"

on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  Set-repos:
    name: "🐂 Parse repos.json"
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'who-ssasori/Begonia-Kernel' || (github.repository_owner == 'cvnertnc' && github.repository == 'cvnertnc/Begonia-Kernel-Builder') }}
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
      builddate: ${{ steps.generate-builddate.outputs.builddate }}
    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v3

      - name: "😄 Generate Matrix"
        id: generate-matrix
        shell: bash
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          jq -s '.[][]' repos/repos*.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "⏰ Set builddate"
        id: generate-builddate
        shell: bash
        run: echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐅 Build kernel"
    runs-on: ubuntu-latest
    if: github.repository == 'who-ssasori/Begonia-Kernel'
    needs:
      - Set-repos
    strategy:
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}

    env:
      WORKSPACE: ${{ github.workspace }}
      builddate: "${{ needs.Set-repos.outputs.builddate }}"
      KNAME: ${{ matrix.repos.kernelName }}
      KERNEL_DEVICE: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.defconfig }}
      withRoot: ${{ matrix.repos.withRoot }}
      withSUSFS: ${{ matrix.repos.withSUSFS }}
      whichSUSFS: ${{ matrix.repos.whichSUSFS }}
      withKPM: ${{ matrix.repos.withKPM }}
      ccache: ${{ matrix.repos.ccache }}
      useAnykernel: ${{ matrix.repos.AnyKernel3.use }}
      release: ${{ matrix.repos.AnyKernel3.release }}

    steps:
      - name: "😄 Checkout Builder Repo"
        uses: actions/checkout@v3

      - name: "🟣 Set Kernel Variables"
        shell: bash
        run: |
          set -euxo pipefail

          echo "KERNEL_NAME=${{ matrix.repos.kernelSource.name }}" >> $GITHUB_ENV
          echo "KERNEL_REPO=${{ matrix.repos.kernelSource.repo }}" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=${{ matrix.repos.kernelSource.branch }}" >> $GITHUB_ENV

          echo "toolchains=$(echo '${{ toJSON(matrix.repos.toolchains) }}' | jq -c)" >> $GITHUB_ENV
          echo "params=$(echo '${{ toJSON(matrix.repos.params) }}' | jq -c)" >> $GITHUB_ENV
          echo "THREAD=$(nproc --all)" >> $GITHUB_ENV

      - name: "⭐ Install prerequisites"
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar
          sudo apt-get install -y checkinstall libncursesw5-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev

          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xvf Python-2.7.18.tgz
          cd Python-2.7.18

          export CFLAGS="-std=gnu17"
          export CPPFLAGS="-std=gnu17"

          ./configure
          make -j"$(nproc)" CFLAGS="-std=gnu17"
          sudo make install

          curl https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
          sudo python2.7 get-pip.py
          sudo update-alternatives --install /usr/bin/python python /usr/local/bin/python2.7 1
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 2 || true
          cd ..

      - name: "🚮 Clear older runs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+5 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

      - name: "🚣 Create cache key from `repos`"
        if: ${{ env.ccache == 'true' }}
        id: ccache_key
        shell: bash
        run: |
          set -euxo pipefail
          ccache -o compression=false -o cache_dir=$HOME/.ccache
          echo "CACHE_KEY=$(echo -n '${{ toJSON(matrix.repos) }}' | base64 -w 0 | cut -c -48)" >> $GITHUB_OUTPUT

      - name: "🛋️ Cache ccache files"
        if: ${{ env.ccache == 'true' }}
        uses: actions/cache@v3
        with:
          path: |
            ~/.ccache
            ${{ env.OUT_DIR }}
          key: ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}
          restore-keys: |
            ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}

      - name: "⏰ Setup Anykernel3"
        shell: bash
        env:
          params: "${{ toJSON(matrix.repos.AnyKernel3) }}"
        run: |
          set -euxo pipefail

          ANYKERNEL_REPO=$(echo "$params" | jq -r ".repo")
          ANYKERNEL_BRANCH=$(echo "$params" | jq -r ".branch")

          rm -rf AnyKernel3

          if git ls-remote --exit-code --heads "$ANYKERNEL_REPO" "$ANYKERNEL_BRANCH" >/dev/null 2>&1; then
            git clone --recursive --depth=1 -j "$(nproc)" --branch "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" AnyKernel3
          else
            echo "Branch '$ANYKERNEL_BRANCH' not found in $ANYKERNEL_REPO; falling back to main"
            git clone --recursive --depth=1 -j "$(nproc)" --branch main "$ANYKERNEL_REPO" AnyKernel3
          fi

          test -d AnyKernel3
          echo "🤔 Setup Anykernel3 => ($ANYKERNEL_REPO)"

      - name: "🌟 Clone kernel source => (${{ env.KERNEL_REPO }})"
        shell: bash
        run: |
          set -euxo pipefail

          if git ls-remote --exit-code --heads "$KERNEL_REPO" "$KERNEL_BRANCH" >/dev/null 2>&1; then
            git clone --recursive --depth=1 -j "$(nproc)" --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_NAME"
          else
            echo "Branch '$KERNEL_BRANCH' not found in $KERNEL_REPO; falling back to main"
            git clone --recursive --depth=1 -j "$(nproc)" --branch main "$KERNEL_REPO" "$KERNEL_NAME"
          fi

          test -d "$KERNEL_NAME"
          echo -e "\n⚠️ Kernel is at commit: $(git -C "$KERNEL_NAME" rev-parse HEAD)\n"
          echo "🤔 Clone kernel source => ($KERNEL_REPO)"

      - name: "🔑 Get toolchains"
        shell: bash
        run: |
          set -euxo pipefail

          toolchains_num="$(echo "$toolchains" | jq 'length')"
          echo "🤔 There is $toolchains_num defined toolchains."
          for ((i=0;i<toolchains_num;i++)); do
            toolchain_name=$(echo "$toolchains" | jq -r ".[$i].name")
            toolchain_repo=$(echo "$toolchains" | jq -r ".[$i].repo")
            toolchain_branch=$(echo "$toolchains" | jq -r ".[$i].branch")
            toolchain_url=$(echo "$toolchains" | jq -r ".[$i].url")

            echo "$toolchain_url"
            if [ -z "${toolchain_url:-}" ] || [ "$toolchain_url" = "null" ]; then
              if git ls-remote --exit-code --heads "$toolchain_repo" "$toolchain_branch" >/dev/null 2>&1; then
                git clone --recursive --depth=1 -j "$(nproc)" --branch "$toolchain_branch" "$toolchain_repo" "$toolchain_name"
              else
                echo "Branch '$toolchain_branch' not found in $toolchain_repo; falling back to main"
                git clone --recursive --depth=1 -j "$(nproc)" --branch main "$toolchain_repo" "$toolchain_name"
              fi
              echo "🤔 Clone $toolchain_name => ($toolchain_repo)"
            else
              wget "$toolchain_url"
              filename="${toolchain_url##*/}"

              mkdir -p "$toolchain_name"
              case "$filename" in
                *.zip)
                  unzip -d "$toolchain_name" "$filename"
                  ;;
                *.tar)
                  tar xvf "$filename" -C "$toolchain_name"
                  ;;
                *.tar.gz)
                  tar zxvf "$filename" -C "$toolchain_name"
                  ;;
                *.rar)
                  unrar x "$filename" "$toolchain_name"
                  ;;
                *)
                  echo "unknown file type: $filename"
                  ;;
              esac
            fi

            jq -r ".[$i].binPath[] | tostring" <<< "$toolchains" | while read -r bin_path; do
              echo "$WORKSPACE/$toolchain_name/$bin_path" >> $GITHUB_PATH
            done
          done

      - name: "😎 Set args"
        id: generate-args
        shell: bash
        run: |
          set -euxo pipefail

          echo "🤔 PATH Variable: $PATH"

          ARCH=$(echo "$params" | jq -r ".ARCH")
          CC=$(echo "$params" | jq -r ".CC")

          args="-j${{ env.THREAD }}"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p "${{ env.OUT_DIR }}" && args="$args O=${{ env.OUT_DIR }}"
          fi
          if [ -n "$ARCH" ]; then
            args="$args ARCH=$ARCH"
          fi
          if [ -n "$CC" ]; then
            if [[ "$CC" == *"/"* ]]; then
              CC="${{ env.WORKSPACE }}/$CC"
            fi

            if [ "${{ env.ccache }}" = true ]; then
              args="$args CC=\"ccache $CC\""
            else
              args="$args CC=$CC"
            fi
          fi

          while read -r externalCommand; do
            key=$(echo "$externalCommand" | cut -d= -f1)
            value=$(echo "$externalCommand" | cut -d= -f2)
            if [[ "$value" == *"/"* ]]; then
              value="${{ env.WORKSPACE }}/$value"
            fi
            args="$args $key=$value"
          done < <(jq -r '.externalCommand | to_entries[] | "\(.key)=\(.value)"' <<< "$params")

          echo "🤔 $args"
          echo "ARCH=$ARCH" >> $GITHUB_OUTPUT
          echo "args=$args" >> $GITHUB_OUTPUT

      - name: "🛰️ Receiving scripts"
        id: receiving-scripts
        working-directory: ${{ env.KERNEL_NAME }}
        shell: bash
        env:
          SUS_URL: ${{ secrets.SUS_URL }}
          SUS_PASSWORD: ${{ secrets.SUS_PASSWORD }}
        run: |
          set -euxo pipefail

          if [ -d "./BKB" ]; then
            rm -rf "./BKB"
          fi

          if [ -n "${SUS_URL:-}" ] && [ -n "${SUS_PASSWORD:-}" ]; then
            echo "⬇️ Downloading encrypted BKB archive..."
            wget -q -O sus.zip.enc "$SUS_URL"

            echo "🔓 Decrypting..."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
              -in sus.zip.enc -out sus.zip \
              -pass env:SUS_PASSWORD

            mkdir -p BKB
            unzip -q sus.zip -d BKB/
            rm -f sus.zip sus.zip.enc
          elif [ -f "${WORKSPACE}/.github/script/susfs4ksu.zip.enc" ] && [ -n "${SUS_PASSWORD:-}" ]; then
            echo "🔓 Decrypting bundled susfs4ksu.zip.enc archive..."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
              -in "${WORKSPACE}/.github/script/susfs4ksu.zip.enc" -out sus.zip \
              -pass env:SUS_PASSWORD

            mkdir -p BKB
            unzip -q sus.zip -d BKB/
            rm -f sus.zip
          else
            echo "⬇️ Cloning public susfs4ksu-begonia archive..."
            git clone --recursive --depth=1 -j "$(nproc)" --branch main https://github.com/vc-teahouse/susfs4ksu-begonia BKB
          fi

          echo "✅ BKB scripts ready at $(pwd)/BKB"

      - name: "💉 APatch, SukiSU setup and [BACKPORT]: ptrace"
        id: apatch-sukisu-setup
        working-directory: ${{ env.KERNEL_NAME }}
        shell: bash
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euxo pipefail

          BKB_YML=releases
          if [ -f "BKB/kernel_patches/bkb/$BKB_YML/apatch_sukisu_setup.sh" ]; then
            chmod +x "BKB/kernel_patches/bkb/$BKB_YML/apatch_sukisu_setup.sh"
            "./BKB/kernel_patches/bkb/$BKB_YML/apatch_sukisu_setup.sh"
          else
            echo -e 'CONFIG_KALLSYMS_ALL=y' >> "arch/${arch}/configs/${DEFCONFIG_NAME}"
            patch -p1 < BKB/kernel_patches/0001-main-patch-kernel.patch
            curl -LSs https://github.com/sidex15/android_kernel_lge_sm8150/commit/fcc59dc3310d3a1511d02dc3ac6d1e113517ece1.patch | patch -p1
          fi

      - name: "😋 Integrate KernelSU or KernelSU-Next"
        id: integrate-kernelsu-next
        working-directory: ${{ env.KERNEL_NAME }}
        if: ${{ env.withRoot == 'ksu' || env.withRoot == 'sukisu' || env.withRoot == 'ksun' }}
        shell: bash
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
          withRoot: ${{ env.withRoot }}
          withKPM: ${{ env.withKPM }}
          KNAME: ${{ env.KNAME }}
        run: |
          set -euxo pipefail

          BKB_YML=releases
          if [ -f "BKB/kernel_patches/bkb/$BKB_YML/integrate_kernelsu.sh" ]; then
            chmod +x "BKB/kernel_patches/bkb/$BKB_YML/integrate_kernelsu.sh"
            "./BKB/kernel_patches/bkb/$BKB_YML/integrate_kernelsu.sh"
          else
            rm -rf ./KernelSU ./KernelSU-Next ./drivers/kernelsu

            if [[ "$withRoot" == "ksu" ]]; then
              curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master
            elif [[ "$withRoot" == "sukisu" ]]; then
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
            else
              if [ -f "${WORKSPACE}/.github/script/ksun.sh" ]; then
                bash "${WORKSPACE}/.github/script/ksun.sh" next
              else
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              fi
            fi

            if [ -d "KernelSU" ]; then
              ROOT_VERSION=$(git -C KernelSU describe --abbrev=0 --tags || echo "unknown")
            elif [ -d "KernelSU-Next" ]; then
              ROOT_VERSION=$(git -C KernelSU-Next describe --abbrev=0 --tags || echo "unknown")
            else
              ROOT_VERSION="unknown"
            fi

            echo "ROOT_VERSION=${ROOT_VERSION}" >> "$GITHUB_OUTPUT"

            echo -e 'CONFIG_KSU=y' >> "arch/${arch}/configs/${DEFCONFIG_NAME}"
            if [[ "$withRoot" == "sukisu" ]]; then
              if [[ "$withKPM" == "true" ]]; then
                echo -e 'CONFIG_KPM=y' >> "arch/${arch}/configs/${DEFCONFIG_NAME}"
              fi
              echo -e 'CONFIG_KSU_MANUAL_HOOK=y' >> "arch/${arch}/configs/${DEFCONFIG_NAME}"
            elif [[ "$withRoot" == "ksun" ]]; then
              echo -e 'CONFIG_KSU_WITH_KPROBES=n' >> "arch/${arch}/configs/${DEFCONFIG_NAME}"
            fi

            if [[ "$KNAME" == "astera" || "$KNAME" == "nova" ]]; then
              patch -p1 < BKB/kernel_patches/0001-standard-ksu-hook_1.patch
            else
              patch -p1 < BKB/kernel_patches/0001-standard-ksu-hook_2.patch
            fi
          fi

      - name: "🥷 Add SUSFS patches"
        id: add-susfs-patches
        working-directory: ${{ env.KERNEL_NAME }}
        if: ${{ (env.withRoot == 'ksu' || env.withRoot == 'sukisu' || env.withRoot == 'ksun') && env.withSUSFS == 'true' }}
        shell: bash
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
          withRoot: ${{ env.withRoot }}
          withSUSFS: ${{ env.withSUSFS }}
          whichSUSFS: ${{ matrix.repos.whichSUSFS }}
          KNAME: ${{ env.KNAME }}
        run: |
          set -euxo pipefail

          BKB_YML=releases
          if [ -f "BKB/kernel_patches/bkb/$BKB_YML/add_susfs_patches.sh" ]; then
            chmod +x "BKB/kernel_patches/bkb/$BKB_YML/add_susfs_patches.sh"
            "./BKB/kernel_patches/bkb/$BKB_YML/add_susfs_patches.sh"
          else
            cp -v "BKB/kernel_patches/${whichSUSFS}/fs/"* fs/
            cp -v "BKB/kernel_patches/${whichSUSFS}/include/linux/"* include/linux/

            if [[ "$withRoot" == "ksun" ]]; then
              KSU_DIR="KernelSU"
              if [ ! -d "$KSU_DIR" ] && [ -d "KernelSU-Next" ]; then
                KSU_DIR="KernelSU-Next"
              fi
              patch -d "$KSU_DIR" -p1 < "BKB/kernel_patches/${whichSUSFS}/KernelSU/10_enable_susfs_for_ksun.patch"
            else
              rm -rf ./KernelSU ./drivers/kernelsu
              if [[ "$withRoot" == "ksu" ]]; then
                curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s 12104+155
              else
                if [[ "$whichSUSFS" == "157" ]]; then
                  curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-1.5.7
                else
                  curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
                fi
              fi
            fi

            if [[ "$KNAME" == "nova" || "$KNAME" == "power" ]]; then
              patch -p1 < "BKB/kernel_patches/${whichSUSFS}/50_add_susfs_in_kernel-4.14_2.patch"
            else
              patch -p1 < "BKB/kernel_patches/${whichSUSFS}/50_add_susfs_in_kernel-4.14_1.patch"
            fi

            printf '%s\n' \
              "#Susfs4ksu" \
              "CONFIG_KSU_SUSFS=y" \
              "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" \
              "CONFIG_KSU_SUSFS_SUS_PATH=y" \
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y" \
              "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" \
              "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" \
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
              "CONFIG_KSU_SUSFS_ENABLE_LOG=y" \
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" \
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" \
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" \
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" \
              "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" \
              "#Mountify" \
              "CONFIG_OVERLAY_FS=y" \
              "CONFIG_TMPFS_XATTR=y" >> "arch/${arch}/configs/${DEFCONFIG_NAME}"
          fi

      - name: "👍 Make defconfig"
        working-directory: ${{ env.KERNEL_NAME }}
        shell: bash
        env:
          args: ${{ steps.generate-args.outputs.args }}
          arch: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          set -euxo pipefail
          echo "PATH Variable: $PATH"
          make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}

      - name: "🎶 Build kernel"
        working-directory: ${{ env.KERNEL_NAME }}
        shell: bash
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          set -euxo pipefail
          echo "PATH Variable: $PATH"
          make ${{ env.args }}

          echo "Checking expected boot image..."
          find "${{ env.OUT_DIR }}" -path "*/boot/Image.gz" -o -path "*/boot/Image" | head -n 20

      - name: "☯️ KPM Injection"
        id: kpm-inject
        working-directory: ${{ env.KERNEL_NAME }}
        if: ${{ env.withRoot == 'sukisu' && env.withKPM == 'true' }}
        shell: bash
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
          OUT_DIR: ${{ env.OUT_DIR }}
        run: |
          set -euxo pipefail

          BKB_YML=releases
          if [ -f "BKB/kernel_patches/bkb/$BKB_YML/kpm_injection.sh" ]; then
            chmod +x "BKB/kernel_patches/bkb/$BKB_YML/kpm_injection.sh"
            "./BKB/kernel_patches/bkb/$BKB_YML/kpm_injection.sh"
          else
            mkdir -p ~/SukiSUPatch
            cd ~/SukiSUPatch
            TAG=$(curl -s https://api.github.com/repos/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases | \
              jq -r 'map(select(.prerelease)) | first | .tag_name')
            echo "Latest tag is: $TAG"
            curl -Ls -o patch_linux "https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/$TAG/patch_linux"
            chmod +x patch_linux
            mv "${OUT_DIR}/arch/${arch}/boot/Image" ~/SukiSUPatch/Image
            rm -rf "${OUT_DIR}/arch/${arch}/boot/Image.gz"
            ./patch_linux
            rm -rf ./Image
            mv -f oImage Image
            gzip -k Image
            mv ~/SukiSUPatch/Image.gz "${OUT_DIR}/arch/${arch}/boot/Image.gz"
            cd ..
          fi

      - name: "✏️ Set root version fallback"
        id: root-version
        shell: bash
        run: |
          set -euxo pipefail

          ROOT_VERSION="${{ steps.integrate-kernelsu-next.outputs.ROOT_VERSION }}"
          if [ -z "${ROOT_VERSION:-}" ]; then
            ROOT_VERSION="unknown"
          fi

          echo "ROOT_VERSION=${ROOT_VERSION}" >> "$GITHUB_ENV"
          echo "ROOT_VERSION=${ROOT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: "❤️ Pack AnyKernel3.zip"
        if: ${{ env.useAnykernel == 'true' }}
        shell: bash
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
          ROOT_VERSION: ${{ steps.root-version.outputs.ROOT_VERSION }}
        run: |
          set -euxo pipefail

          IMG_PATH=""
          for p in \
            "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz" \
            "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image" \
            "${{ env.KERNEL_NAME }}/out/arch/${{ env.arch }}/boot/Image.gz" \
            "${{ env.KERNEL_NAME }}/out/arch/${{ env.arch }}/boot/Image"
          do
            if [ -f "$p" ]; then
              IMG_PATH="$p"
              break
            fi
          done

          if [ -z "${IMG_PATH:-}" ]; then
            echo "Kernel image not found. Searching output tree..."
            find "${{ env.OUT_DIR }}" -maxdepth 8 -type f 2>/dev/null | head -n 100
            exit 1
          fi

          cp -f "$IMG_PATH" ./AnyKernel3/

          cd AnyKernel3
          zip -q -r "${{ env.WORKSPACE }}/${{ env.KERNEL_DEVICE }}-${{ env.ROOT_VERSION }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}.zip" .

      - name: "💾 Upload AnyKernel3 image => (${{ env.builddate }})"
        uses: actions/upload-artifact@v4
        if: ${{ env.useAnykernel == 'true' }}
        env:
          ROOT_VERSION: ${{ steps.root-version.outputs.ROOT_VERSION }}
        with:
          name: "${{ env.KERNEL_DEVICE }}-${{ env.ROOT_VERSION }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}"
          path: AnyKernel3/*

      - name: 🧧 Create GitHub Release => (${{ env.builddate }})
        continue-on-error: false
        uses: softprops/action-gh-release@v2.1.0
        if: ${{ env.useAnykernel == 'true' && env.release == 'true' }}
        env:
          ROOT_VERSION: ${{ steps.root-version.outputs.ROOT_VERSION }}
        with:
          tag_name: v${{ env.builddate }}
          name: v${{ env.builddate }}
          make_latest: true
          prerelease: false
          draft: false
          generate_release_notes: false
